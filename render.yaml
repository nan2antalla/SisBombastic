databases:
  - name: bombastic-db
    databaseName: bombastic
    plan: free
    region: oregon

services:
  - type: web
    name: bombastic-api
    runtime: node
    plan: free
    region: oregon
    # Si subiste SOLO la carpeta 1_ESTO_PARA_ONLINE al repo, usa: backend
    # Si subiste TODO SisBombastic, usa: 1_ESTO_PARA_ONLINE/backend
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bombastic-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
